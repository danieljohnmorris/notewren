<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">NoteWren planned sync architecture</title>
  <desc id="desc">Your desktop, laptop, tablet and phone each keep an offline library. CLI and MCP provide agent access to the same local library. Devices exchange document changes with an optional self-hosted sync server. Proposed architecture, not implemented.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a64028" stroke-width="1.6" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1000" height="660" rx="20" fill="#f9f2e6"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="48" y="54" font-size="15" font-weight="650" letter-spacing="2" fill="#a64028">NOTEWREN / PLANNED SYNC</text>
    <text x="48" y="102" font-size="32" font-weight="700" letter-spacing="-.7" fill="#171717">Local notes. An optional shared server.</text>

    <rect x="48" y="154" width="400" height="396" rx="12" fill="#fffcf7" stroke="#dedbd3"/>
    <text x="72" y="194" font-size="26" font-weight="650" fill="#171717">Your devices</text>
    <g fill="#f0ece4" stroke="#dedbd3">
      <rect x="72" y="216" width="352" height="44" rx="6"/>
      <rect x="72" y="268" width="352" height="44" rx="6"/>
      <rect x="72" y="320" width="352" height="44" rx="6"/>
      <rect x="72" y="372" width="352" height="44" rx="6"/>
    </g>
    <g fill="#171717" font-size="21" font-weight="550">
      <text x="92" y="245">Desktop</text>
      <text x="92" y="297">Laptop</text>
      <text x="92" y="349">Tablet</text>
      <text x="92" y="401">Phone</text>
    </g>
    <text x="72" y="452" font-size="19" fill="#62645b">Each keeps its own offline library</text>
    <path d="M 72 471 H 424" stroke="#dedbd3"/>
    <text x="72" y="502" font-size="21" font-weight="600" fill="#403f39">Agent access: CLI + MCP</text>
    <text x="72" y="529" font-size="18" fill="#62645b">Same local library and Rust core</text>
    <path d="M 458 353 H 628" fill="none" stroke="#a64028" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="544" y="323" font-size="18" text-anchor="middle" fill="#62645b">Push / pull</text>

    <rect x="640" y="244" width="312" height="218" rx="12" fill="#f2e6d7" stroke="#cdbba6" stroke-width="1.5"/>
    <g fill="none" stroke="#a64028" stroke-width="2.2" stroke-linecap="round">
      <rect x="664" y="271" width="28" height="12" rx="3"/><rect x="664" y="289" width="28" height="12" rx="3"/><path d="M 684 277 H 685 M 684 295 H 685"/>
    </g>
    <text x="710" y="282" font-size="25" font-weight="650" fill="#171717">Sync server</text>
    <text x="710" y="311" font-size="19" fill="#62645b">Optional · self-hosted</text>
    <path d="M 664 338 H 928" stroke="#cdbba6"/>
    <text x="664" y="375" font-size="21" font-weight="600" fill="#403f39">Documents and revisions</text>
    <text x="664" y="410" font-size="18" fill="#62645b">Keep conflicting versions</text>

    <path d="M 48 588 H 952" stroke="#dedbd3"/>
    <text x="48" y="623" font-size="19" fill="#62645b">Each device owns its local store. Sync exchanges document changes, not database files.</text>
  </g>
</svg>
